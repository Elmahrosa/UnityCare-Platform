name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy backend
        working-directory: ./backend
        run: railway up --service backend-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy frontend
        working-directory: ./frontend
        run: railway up --service frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Run seed script
        run: |
          curl -X POST https://api.elmahrosa.org/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@unitycare.demo","password":"Demo@2026Admin"}' \
            --fail --silent --output /dev/null || echo "Seed skipped (API not ready)"
